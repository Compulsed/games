<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bossfall 3D</title>
<style>
  :root {
    --bg: #130f1c; --panel: #1f1830; --panel2: #2b2143; --line: #47396a;
    --gold: #e8b84a; --text: #f0e7d6; --mute: #a698bd; --good: #6fd38a; --bad: #e66a60; --mana: #6ab4ff; --steel: #b9b3c4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background: linear-gradient(rgba(19, 15, 28, .55), rgba(19, 15, 28, .92)), url(art/bg.webp) center top / cover, var(--bg); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: default; }
  #app { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }

  header { display: flex; align-items: center; gap: 8px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 22px; letter-spacing: 1px; margin: 0; color: var(--gold); flex: 1; }
  h1 small { font-size: 12px; color: var(--mute); letter-spacing: 2px; margin-left: 4px; }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; }
  .round.on { border-color: var(--gold); color: var(--gold); }
  a.round { display: inline-flex; align-items: center; justify-content: center; color: var(--mute); text-decoration: none; font-size: 12px; }

  .stances { display: flex; gap: 6px; }
  .stances button { flex: 1; padding: 7px 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-size: 13px; line-height: 1.2; }
  .stances button small { display: block; font-size: min(10px, 2.5vw); white-space: nowrap; color: var(--mute); }
  .stances button.on { border-color: var(--gold); background: var(--panel2); color: var(--gold); }

  /* The 3D board: a canvas filling the flexible space, with live numbers in HTML on top. */
  .stage { flex: 1; min-height: 0; position: relative; margin: 0 calc(50% - 50vw); touch-action: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; -webkit-mask-image: linear-gradient(transparent, #000 4%, #000 93%, transparent); mask-image: linear-gradient(transparent, #000 4%, #000 93%, transparent); }
  .chip.cap { transform-origin: 50% 100%; }
  .chip { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; will-change: transform; }
  .cap { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); text-shadow: 0 1px 2px #000; }
  .stats { display: flex; gap: 4px; }
  .stat { font-weight: 800; font-size: 17px; padding: 2px 8px; border-radius: 11px; background: rgba(31, 24, 48, .88); border: 1.5px solid var(--line); min-width: 48px; text-align: center; line-height: 1.1; }
  .stat small { display: block; font-size: 8px; font-weight: 600; color: var(--mute); letter-spacing: 1px; }
  .stat.mana { color: var(--mana); }
  .stat span { display: inline-block; }
  .mid { text-align: center; }
  .mid .vs { font-family: Georgia, serif; color: var(--mute); font-size: 15px; text-shadow: 0 1px 3px #000; }
  .mid .ok { font-size: 21px; font-weight: 800; min-height: 26px; text-shadow: 0 1px 4px #000; }
  .mid .ok.neg { color: var(--bad); } .mid .ok.pos { color: var(--good); }
  .bump { animation: bump .3s; }
  @keyframes bump { 40% { transform: scale(1.25); color: var(--gold); } }
  .punch { animation: punch .5s; }
  @keyframes punch { 35% { transform: scale(1.7); color: var(--gold); text-shadow: 0 0 10px var(--gold); } }
  .punch3 { animation: punch3 .6s; }
  @keyframes punch3 { 35% { transform: scale(2.2) rotate(-6deg); color: #fff3c4; text-shadow: 0 0 16px var(--gold); } }
  .pop { position: absolute; left: 0; top: 0; pointer-events: none; font-weight: 900; font-size: 24px; color: #fff; text-shadow: 0 2px 4px #000, 0 0 8px rgba(0, 0, 0, .6); white-space: nowrap; animation: rise var(--d, .9s) ease-out forwards; }
  .pop.gold { color: var(--gold); } .pop.mana { color: var(--mana); } .pop.dull { color: var(--mute); font-size: 18px; } .pop.big { font-size: 40px; }
  @keyframes rise { 0% { opacity: 0; translate: -50% 0; scale: .6; } 15% { opacity: 1; scale: 1.15; } 30% { scale: 1; } 100% { opacity: 0; translate: -50% -48px; } }
  .nogl { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 15px; }
  .nogl a, .sheet a { color: var(--gold); }

  .meter { position: relative; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #6b3a1e, var(--gold)); opacity: .55; transition: width .4s ease-out; }
  .meter .segs { position: absolute; inset: 0; display: flex; }
  .meter .seg { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border-left: 1px solid var(--line); }
  .meter .seg:first-child { border-left: 0; color: var(--bad); }
  .meter .seg.kill { border-left: 3px solid var(--gold); }
  .meter .seg.lit { background: rgba(232, 184, 74, .35); color: #fff; }
  .mcap { display: flex; justify-content: space-between; font-size: 10px; color: var(--mute); margin-top: 3px; }

  .log { min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; padding: 4px 10px; border-radius: 10px; background: rgba(0, 0, 0, .25); }
  .log.win { background: rgba(111, 211, 138, .16); color: var(--good); font-weight: 700; font-size: 16px; }
  .log.bigwin { background: rgba(232, 184, 74, .2); color: var(--gold); font-weight: 800; font-size: 18px; animation: pulse .6s 3; }
  .log.lose { color: var(--mute); }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pill { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 10px; }
  .pill .k { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); }
  .pill .v { font-size: 17px; font-weight: 800; }
  .pill.win .v { color: var(--gold); }
  .betrow { grid-column: 1 / 3; display: flex; gap: 6px; align-items: stretch; }
  .sq { width: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-size: 22px; font-weight: 700; }
  .betrow .pill { width: 96px; text-align: center; }
  #play { flex: 1; min-height: 54px; border-radius: 27px; background: linear-gradient(#f3cb68, #c98f1e); color: #2a1a00; font-weight: 800; font-size: 19px; letter-spacing: 1px; box-shadow: 0 3px 0 #7d560c; }
  #play:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d560c; }

  #modal { position: fixed; inset: 0; background: rgba(8, 5, 14, .8); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #modal.open { display: flex; }
  .sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px 16px 24px; font-size: 14px; line-height: 1.45; user-select: text; -webkit-user-select: text; }
  .sheet h2 { font-family: Georgia, serif; color: var(--gold); margin: 0 0 6px; font-size: 20px; }
  .sheet h3 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); margin: 16px 0 6px; }
  .sheet p { margin: 6px 0; }
  .sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sheet td, .sheet th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .sheet th { font-size: 11px; color: var(--mute); font-weight: 600; }
  .sheet td.r, .sheet th.r { text-align: right; }
  .sheet .close { width: 100%; margin-top: 16px; padding: 12px; border-radius: 12px; background: var(--panel2); border: 1.5px solid var(--line); font-weight: 700; }
  .sheet .fine { font-size: 12px; color: var(--mute); }

  /* Short landscape screens: the board on the left, the controls on the right. */
  @media (orientation: landscape) and (max-height: 540px) {
    #app { max-width: 980px; display: grid; grid-template-columns: 1fr minmax(290px, 360px); grid-template-rows: auto auto 1fr auto auto; column-gap: 12px; }
    .stage { grid-column: 1; grid-row: 1 / 6; margin: 0; }
    header, .stances, .mwrap, .log, .hud { grid-column: 2; }
    .mwrap { align-self: end; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bossfall<small>3D</small></h1>
    <a class="round" href="index.html" title="Switch to the 2D board" aria-label="Switch to the 2D board">2D</a>
    <button class="round" id="bSound" aria-label="Sound on or off" title="Sound">♪</button>
    <button class="round" id="bTurbo" aria-label="Fast play on or off" title="Fast play: flips every card for you">»</button>
    <button class="round" id="bInfo" aria-label="Rules and payouts" title="Rules">i</button>
  </header>

  <div class="stances" id="stances"></div>

  <div class="stage" id="stage">
    <canvas id="gl" aria-label="The board: your champion and the boss at the back, six cards in front"></canvas>
    <div class="chip cap" id="kChamp">Your champion</div>
    <div class="chip cap" id="kBoss">The boss</div>
    <div class="chip" id="cChamp"><div class="stats">
      <div class="stat"><span id="dmg">–</span><small>DMG</small></div>
      <div class="stat mana"><span id="mana">–</span><small>MANA</small></div>
    </div></div>
    <div class="chip mid" id="cMid"><div class="vs">VS</div><div class="ok" id="ok"></div></div>
    <div class="chip" id="cBoss"><div class="stats"><div class="stat"><span id="hp">–</span><small>HP</small></div></div></div>
  </div>

  <div class="mwrap">
    <div class="meter"><div class="fill" id="fill"></div><div class="segs" id="segs"></div></div>
    <div class="mcap"><span>boss survives</span><span>overkill pays more →</span></div>
  </div>

  <div class="log" id="log">Flip your champion, then flip six cards in any order. Out-damage the boss to win.</div>

  <div class="hud">
    <div class="pill"><div class="k">Coins</div><div class="v" id="bal"></div></div>
    <div class="pill win"><div class="k">Win</div><div class="v" id="win">0.00</div></div>
    <div class="betrow">
      <button class="sq" id="bMinus" aria-label="Lower play amount">−</button>
      <div class="pill"><div class="k">Play amount</div><div class="v" id="bet"></div></div>
      <button class="sq" id="bPlus" aria-label="Raise play amount">+</button>
      <button id="play">PLAY</button>
    </div>
  </div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="engine.js"></script>
<script type="module">
// The rules and maths (CHAMPS, CARDS, BOSSES, STANCES, playRound, ...) are in engine.js; this page only shows a round.
import * as THREE from './vendor/three.module.js';
const $ = id => document.getElementById(id);
const BETS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100];
const START = 1000;
// phase: idle → champ (flip the champion) → cards (flip six) → idle
const S = { balance: START, betIdx: 3, stance: 'warband', phase: 'idle', turbo: false, sound: true };
let R = null, flips = 0, lock = false, bet = 0, queued = null;
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const wait = ms => new Promise(r => setTimeout(r, S.turbo ? ms * 0.4 : ms));
const payText = p => (p ? p + 'x' : '✕');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Sound: small synth tones, no audio files.
let actx = null;
function tone(freq, dur = 0.12, type = 'triangle', when = 0, vol = 0.12) {
  if (!S.sound) return;

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* no audio available */ }
}
const SFX = {
  flip: () => tone(520, 0.06, 'square', 0, 0.05),
  phys: () => { tone(220, 0.08, 'square', 0, 0.08); tone(440, 0.1, 'triangle', 0.05); },
  spell: () => { tone(660, 0.12, 'sine'); tone(990, 0.2, 'sine', 0.08); },
  mult: () => [440, 660, 880, 1320].forEach((f, i) => tone(f, 0.14, 'sawtooth', i * 0.07, 0.08)),
  void: () => { tone(200, 0.2, 'square', 0, 0.06); tone(150, 0.25, 'square', 0.12, 0.06); },
  boss: () => tone(140, 0.3, 'sawtooth', 0, 0.1),
  back: () => tone(300, 0.08, 'sine', 0, 0.05),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', i * 0.1)),
  big: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', i * 0.09, 0.15)),
  lose: () => { tone(294, 0.2, 'sine'); tone(220, 0.35, 'sine', 0.15); },
};

// ───────────────────────────── Scene ─────────────────────────────
const stage = $('stage'), canvas = $('gl');
const PI = Math.PI, V = new THREE.Vector3(), V2 = new THREE.Vector3();
const GOLD = 0xe8b84a, STEEL = 0xb9b3c4, MANA = 0x6ab4ff;
// World layout: the table top is y = 0, the viewer is at +z. Far side: champion (left) and boss (right) standing; near side: two rows of three.
const CW = 1.0, CH = 1.4, BW = 1.12, BH = 1.568, SW = 0.74, SH = 1.036;
const BZ = -1.9, CX = -0.86, BX = 0.86, LEAN = -0.13, EL = 41 * PI / 180;
const SX = [-0.88, 0, 0.88], SZ = [-0.2, 1.0];
const REST = { t: new THREE.Vector3(0, 0.3, -0.5), d: 6, ox: 0, oy: 0 };
const camOff = { x: 0, y: 0, z: 0, k: 1 };
let renderer = null, scene, camera, lost = false, shk = 0, raf = 0, idleT = 0, last = 0;

// Tweens: promise-based, eased, ×0.4 in fast play. A hidden tab finishes them at once.
const E = {
  lin: k => k, out: k => 1 - (1 - k) ** 3, in: k => k * k * k, io: k => (k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2),
  back: k => { const c = 1.5; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; },
  bounce: k => { const n = 7.5625, d = 2.75; return k < 1 / d ? n * k * k : k < 2 / d ? n * (k -= 1.5 / d) * k + 0.75 : k < 2.5 / d ? n * (k -= 2.25 / d) * k + 0.9375 : n * (k -= 2.625 / d) * k + 0.984375; },
};
const tweens = new Set();
function tween(ms, fn, e = E.out) {
  ms *= S.turbo ? 0.4 : 1;
  return new Promise(res => {
    if (!renderer || lost || document.hidden || ms <= 0) { fn(e(1), 1); res(); kick(); return; }
    tweens.add({ t0: performance.now(), ms, fn, e, res }); kick();
  });
}
function finishTweens() { for (const tw of tweens) { tw.fn(tw.e(1), 1); tw.res(); } tweens.clear(); }

function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
let ANISO = 4;
function ctex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO; return t; }
const rgb = h => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];

// Artwork is art/<name>.webp. Faces are canvas textures, drawn once per card and redrawn when its picture arrives; until then, or if it is missing, the emoji shows.
const IMG = {}, FACE = {}, RAD = 0.07;
function loadImg(name, done) { const i = new Image(); i.onload = () => { IMG[name] = i; done(); }; i.onerror = done; i.src = `art/${slug(name)}.webp`; }
function drawFace(f) {
  const { c, kind } = f, el = f.cv, g = el.getContext('2d'), W = el.width, H = el.height, img = IMG[c.name], r = W * RAD;
  const look = kind === 'boss' ? ['#4a2530', '#23131a', '#a04a55'] : kind === 'champ' ? ['#32274f', '#1d1630', '#8a78c0']
    : c.t === 'spell' ? ['#22345a', '#151b33', '#6ab4ff'] : c.t === 'mult' ? ['#4a3a1c', '#231a10', '#e8b84a'] : ['#32274f', '#1d1630', '#b9b3c4'];
  g.clearRect(0, 0, W, H); g.save(); rrect(g, 0, 0, W, H, r); g.clip();
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, look[0]); bg.addColorStop(1, look[1]); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const fade = kind === 'card' ? 0.4 : 0.55;
  if (img) { const s = Math.max(W / img.width, H / img.height); g.drawImage(img, (W - img.width * s) / 2, 0, img.width * s, img.height * s); }
  else { g.font = `${W * 0.42}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(c.icon, W / 2, H * (kind === 'card' ? 0.32 : 0.36)); }
  const fd = g.createLinearGradient(0, H * fade, 0, H * 0.92); fd.addColorStop(0, 'rgba(12,8,20,0)'); fd.addColorStop(1, 'rgba(12,8,20,.95)'); g.fillStyle = fd; g.fillRect(0, 0, W, H);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.shadowColor = 'rgba(0,0,0,.95)'; g.shadowBlur = W * 0.025; g.shadowOffsetY = W * 0.006;
  const two = (y, px, a, b, ca, cb, wt) => {
    g.font = `${wt} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    const wa = g.measureText(a).width, wb = g.measureText(b).width, x = W / 2 - (wa + wb) / 2;
    g.textAlign = 'left'; g.fillStyle = ca; g.fillText(a, x, y); g.fillStyle = cb; g.fillText(b, x + wa, y); g.textAlign = 'center';
  };
  if (kind === 'card') {
    g.fillStyle = '#fff'; g.font = `800 ${W * 0.27}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`; g.fillText(effText(c), W / 2, H * (c.t === 'spell' ? 0.8 : 0.84));
    g.font = `700 ${W * 0.1}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    g.fillStyle = c.t === 'spell' ? '#6ab4ff' : '#d8cfe6'; g.fillText(c.t === 'spell' ? `${c.cost} mana` : c.name, W / 2, H * 0.94);
  } else {
    g.fillStyle = '#f0e7d6'; g.font = `700 ${W * 0.105}px Georgia, "Times New Roman", serif`; g.fillText(c.name, W / 2, H * 0.85);
    if (kind === 'champ') two(H * 0.94, W * 0.078, `${c.atk} ATK · `, `${c.mana} mana`, '#f0e7d6', '#6ab4ff', 700);
    else two(H * 0.94, W * 0.078, `${c.hp} HP`, '', '#f0e7d6', '#fff', 700);
  }
  g.restore();
  const lw = W * 0.035; g.lineWidth = lw; g.strokeStyle = look[2]; rrect(g, lw / 2, lw / 2, W - lw, H - lw, r - lw / 2); g.stroke();
  if (f.tex) f.tex.needsUpdate = true;
}
function faceTex(c, kind) {
  if (!FACE[c.name]) { const big = kind !== 'card'; const f = FACE[c.name] = { c, kind, cv: cv(big ? 400 : 256, big ? 560 : 358) }; drawFace(f); f.tex = ctex(f.cv); }
  return FACE[c.name].tex;
}
const backCv = cv(256, 358);
function drawBack() {
  const g = backCv.getContext('2d'), W = 256, H = 358;
  g.save(); rrect(g, 0, 0, W, H, W * RAD); g.clip();
  if (IMG.back) g.drawImage(IMG.back, 0, 0, W, H);
  else { for (let i = -H; i < W + H; i += 16) { g.fillStyle = (i / 16) % 2 ? '#2c2148' : '#3d2e60'; g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 8, 0); g.lineTo(i + 8 - H, H); g.lineTo(i - H, H); g.fill(); } }
  g.restore(); g.lineWidth = 7; g.strokeStyle = '#47396a'; rrect(g, 3.5, 3.5, W - 7, H - 7, W * RAD - 3.5); g.stroke();
  if (backTex) backTex.needsUpdate = true;
}
let backTex = null;
drawBack();
IMG.back = null;
{ const i = new Image(); i.onload = () => { IMG.back = i; drawBack(); kick(); }; i.src = 'art/back.webp'; }
[...CHAMPS, ...BOSSES, ...CARDS].forEach(c => loadImg(c.name, () => { if (FACE[c.name]) { drawFace(FACE[c.name]); kick(); } }));

function glowTex() {
  const W = 256, H = 358, el = cv(W, H), g = el.getContext('2d'), px = W * 0.09, py = H * 0.075;
  g.shadowColor = '#fff'; g.shadowBlur = 22; g.strokeStyle = '#fff'; g.lineWidth = 9;

// ───────────────────────────── Game ─────────────────────────────
function bump(el, cls = 'bump') { el.classList.remove('bump', 'punch', 'punch3'); void el.offsetWidth; el.classList.add(cls); }
function setNum(el, v, cls) { if (el.textContent !== String(v)) { el.textContent = v; bump(el, cls); } }
function log(text, cls = '') { const l = $('log'); l.className = 'log ' + cls; l.textContent = text; }

// Meter: eight equal segments, one per payout tier.
const BREAKS = [-60, 0, 10, 25, 50, 100, 200, 400, 800];
function meterPos(o) {
  const n = BREAKS.length - 1;
  o = Math.max(BREAKS[0], Math.min(BREAKS[n], o));
  for (let i = 0; i < n; i++) if (o <= BREAKS[i + 1]) return (i + (o - BREAKS[i]) / (BREAKS[i + 1] - BREAKS[i])) / n;
  return 1;
}
function renderMeter(lit = -1) {
  $('segs').innerHTML = STANCES[S.stance].pay.map((p, i) => `<div class="seg ${i === 1 ? 'kill' : ''} ${i === lit ? 'lit' : ''}">${payText(p)}</div>`).join('');
}
function setOverkill(o) {
  const ok = $('ok');
  if (o === null) { ok.textContent = ''; $('fill').style.width = '0'; return; }
  ok.textContent = (o > 0 ? '+' : '') + o;
  ok.className = 'ok ' + (o >= 0 ? 'pos' : 'neg');
  $('fill').style.width = (meterPos(o) * 100).toFixed(1) + '%';
}

function renderStances() {
  const busy = S.phase !== 'idle';
  $('stances').innerHTML = Object.entries(STANCES).map(([k, st]) =>
    `<button data-k="${k}" class="${k === S.stance ? 'on' : ''}" ${busy ? 'disabled' : ''}>${st.name}<small>${st.tag} · max ${st.pay[st.pay.length - 1]}x</small></button>`).join('');
}
function renderHud() {
  const busy = S.phase !== 'idle';
  $('bal').textContent = fmt(S.balance);
  $('bet').textContent = fmt(BETS[S.betIdx]);
  $('bMinus').disabled = busy || S.betIdx === 0;
  $('bPlus').disabled = busy || S.betIdx === BETS.length - 1;
  $('play').textContent = busy ? 'FLIP' : S.balance < BETS[0] ? 'REFILL' : 'PLAY';
  $('bSound').classList.toggle('on', S.sound);
  $('bTurbo').classList.toggle('on', S.turbo);
}
function countUp(el, to) {
  const t0 = performance.now(), d = S.turbo ? 300 : 900;
  (function f(t) { const k = Math.min(1, (t - t0) / d); el.textContent = fmt(to * k); if (k < 1) requestAnimationFrame(f); })(t0);
}
async function resetBoard() {
  $('dmg').textContent = '–'; $('mana').textContent = '–'; $('hp').textContent = '–';
  setOverkill(null); renderMeter();
  await resetScene();
}
// Fast play flips everything for the player.
function auto() { if (S.turbo && S.phase !== 'idle') setTimeout(next, 120); }

async function start() {
  if (S.balance < BETS[0]) { S.balance = START; renderHud(); log('Your coins are refilled. Good luck!'); return; }
  while (S.betIdx > 0 && BETS[S.betIdx] > S.balance) S.betIdx--;
  bet = BETS[S.betIdx];
  S.balance -= bet; S.phase = 'champ'; lock = true; flips = 0; queued = null;
  renderHud(); renderStances(); $('win').textContent = fmt(0);
  await resetBoard();
  R = playRound();
  const bt = faceTex(R.boss, 'boss'); BO.front.map = BO.front.emissiveMap = bt; SFX.boss();
  setNum($('hp'), R.boss.hp);
  log(`${R.boss.name} appears with ${R.boss.hp} HP. Tap your champion to flip it.`);
  await Promise.all([flipTo(BO, true, 450).then(() => { recoil(4); shake(0.02); }), wait(500)]);
  CH_.tap = true; kick();
  lock = false; auto();
}

async function flipChamp() {
  if (S.phase !== 'champ' || lock) return;
  lock = true;
  const c = R.champ;
  CH_.tap = false; CH_.front.map = CH_.front.emissiveMap = faceTex(c, 'champ');
  SFX.phys(); camNudge();
  await flipTo(CH_, true, 420);
  setNum($('dmg'), c.atk); setNum($('mana'), c.mana); setOverkill(c.atk - R.boss.hp);
  emit(P1, 24, champPt(), { col: 0xb9a8ff, col2: 0xffffff, spd: 1.4, up: 0.6, life: 0.6, size: 0.07, grav: 1.5, box: 0.5 });
  log(`${c.name}: ${c.atk} attack, ${c.mana} mana. Now flip the six cards in any order.`);
  await wait(250);
  S.phase = 'cards';
  SM.forEach(x => { x.tap = true; }); kick();
  lock = false; auto();
}

async function flipCard(i) {
  const el = SM[i];
  if (S.phase !== 'cards' || !el || el.rot !== PI || !el.tap) return;
  // A tap during the previous card's animation is kept and played next.
  if (lock) { queued = i; return; }
  lock = true;
  // The deck is shuffled, so the n-th card flipped is the n-th card dealt, whichever one is tapped.
  const ev = R.events[flips++], c = ev.card;
  SM.forEach(x => { x.now = false; });
  el.tap = false; el.now = true; if (hovC === el) hover(null);
  el.front.map = el.front.emissiveMap = faceTex(c, 'card');
  SFX.flip();
  await flipTo(el, true, 400);
  log(ev.text); SFX[ev.fx]();
  const apply = () => {
    setNum($('dmg'), ev.dmg, ev.fx === 'mult' ? (c.v >= 3 ? 'punch3' : 'punch') : 'bump'); setNum($('mana'), ev.mana); setOverkill(ev.dmg - R.boss.hp);
    if (ev.fx === 'phys' || ev.fx === 'spell') pop('+' + c.v, bossPt().add(V.set(0, BH * 0.3, 0)), ev.fx === 'spell' ? 'mana' : '');
  };
  if (ev.fx === 'phys') await fxPhys(el, c, apply);
  else if (ev.fx === 'spell') { setNum($('mana'), ev.mana); await fxSpell(el, c, apply); }
  else if (ev.fx === 'mult') await fxMult(el, c, apply);
  else { apply(); await fxVoid(el); }
  await wait(ev.fx === 'mult' ? 250 : 150);
  if (flips === 6) return finish();
  lock = false;
  if (queued !== null) { const q = queued; queued = null; return flipCard(q); }
  auto();
}

async function finish() {
  SM.forEach(x => { x.now = false; });
  const pay = STANCES[S.stance].pay[R.tier], win = Math.round(pay * bet * 100) / 100;
  renderMeter(R.tier);
  let anim;
  if (win > 0) {
    const big = pay >= 5, even = win <= bet;
    log(`${R.boss.name} falls! Overkill +${R.overkill} · ${pay}x · you ${even ? 'get back' : 'win'} ${fmt(win)}`, big ? 'bigwin' : even ? '' : 'win');
    (big ? SFX.big : even ? SFX.back : SFX.win)();
    S.balance += win; countUp($('win'), win);
    anim = endWin(R.tier, R.tier >= 5);
    if (big) pop(pay + 'x', bossPt().add(V.set(0, BH * 0.2, 0.3)), 'gold big');
  } else {
    log(`${R.boss.name} survives with ${-R.overkill} HP left.`, 'lose');
    SFX.lose();
    anim = endLose();
  }
  await anim;
  await Promise.all([wait(win > 0 ? 500 : 200), win > 0 && camOff.k !== 1 ? wait(250).then(() => camTo(0, 0, 0, 1, 700)) : null]);
  S.phase = 'idle'; lock = false; renderHud(); renderStances();
}

// The main button and the spacebar: start a round, or flip the next card.
function next() {
  if (lock) return;
  if (S.phase === 'idle') start();
  else if (S.phase === 'champ') flipChamp();
  else flipCard(SM.findIndex(c => c.rot === PI && c.tap));
}

  const st = Object.values(STANCES);
  const pays = TIER_LABEL.map((l, i) => `<tr><td>${l}</td>${st.map(s => `<td class="r">${payText(s.pay[i])}</td>`).join('')}</tr>`).join('');
  $('sheet').innerHTML = `

    <p><b>Attacks</b> add damage and cost nothing.<br><b>Spells</b> add more damage but cost mana. If you don't have enough mana left when a spell is flipped, it fizzles and does nothing.<br><b>Multipliers</b> multiply all the damage you have so far, so one that turns up late is worth more.</p>
    <p class="fine">The cards are shuffled and face down, so every card you tap is equally likely to be any of the cards left.</p>
    <h3>Payouts (× play amount)</h3>
    <table><tr><th>Result</th>${st.map(s => `<th class="r">${s.name}</th>`).join('')}</tr>${pays}
    <tr><td>Return to player</td>${st.map(s => `<td class="r">${s.rtp}%</td>`).join('')}</tr></table>
    <p class="fine">The stance only changes the payouts, not the cards. Pick it before you play.</p>
    <h3>Champions</h3>
    <table><tr><th>Champion</th><th class="r">Attack</th><th class="r">Mana</th><th></th></tr>${champs}</table>
    <h3>Bosses</h3>
    <p>${bossRows}. Each is equally likely.</p>
    <h3>Cards</h3>
    <table><tr><th>Card</th><th>Type</th><th class="r">Effect</th><th class="r">Mana</th><th class="r">In deck</th></tr>${rows}</table>
    <h3>Buttons</h3>
    <p><b>−</b> / <b>+</b> change the play amount. <b>PLAY</b> (or the spacebar) starts a round, then becomes <b>FLIP</b>, which flips the next card for you. <b>»</b> is fast play: it flips every card automatically. <b>♪</b> turns sound on or off. <b>i</b> opens this page. <b>2D</b> switches to the flat board.</p>
    <p class="fine">This is the 3D board; the rules, odds and payouts are the same as on the <a href="index.html">2D board</a>.</p>
    <p class="fine">This is a play-coin prototype. No real money is involved and coins have no value. Results are generated in your browser. Return to player is measured over many simulated rounds.</p>
    <button class="close" id="bClose">Close</button>`;
  $('modal').classList.add('open');
  $('bClose').onclick = () => $('modal').classList.remove('open');
}

$('play').onclick = next;
$('bMinus').onclick = () => { if (S.phase === 'idle' && S.betIdx > 0) { S.betIdx--; renderHud(); } };
$('bPlus').onclick = () => { if (S.phase === 'idle' && S.betIdx < BETS.length - 1) { S.betIdx++; renderHud(); } };
$('bSound').onclick = () => { S.sound = !S.sound; renderHud(); if (S.sound) SFX.flip(); };
$('bTurbo').onclick = () => { S.turbo = !S.turbo; renderHud(); auto(); };
$('bInfo').onclick = openInfo;
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('open'); };
$('stances').onclick = e => {
  const b = e.target.closest('button');
  if (!b || S.phase !== 'idle') return;
  S.stance = b.dataset.k; renderStances(); renderMeter();
};
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || $('modal').classList.contains('open')) return;
  e.preventDefault();
  // Otherwise the spacebar would also click whichever button was tapped last.
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  next();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; clearTimeout(idleT); idleT = 0; finishTweens(); } else { last = 0; kick(); } });

// For tests: the phase, and where to tap (page pixels).
window.__bossfall = {
  phase: () => S.phase, busy: () => lock,
  cardPoint: i => toPage(cardPos(SM[i])), champPoint: () => toPage(CH_.m.getWorldPosition(new THREE.Vector3())),
  faceDown: i => SM[i].rot === PI,
};

renderStances(); renderMeter(); renderHud();
initScene();
</script>
</body>
</html>
