<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bossfall</title>
<style>
  :root {
    --bg: #130f1c; --panel: #1f1830; --panel2: #2b2143; --line: #47396a;
    --gold: #e8b84a; --text: #f0e7d6; --mute: #a698bd; --good: #6fd38a; --bad: #e66a60; --mana: #6ab4ff; --steel: #b9b3c4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background: linear-gradient(rgba(19, 15, 28, .6), rgba(19, 15, 28, .92)), url(art/bg.webp) center top / cover, var(--bg); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: default; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }

  header { display: flex; align-items: center; gap: 8px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 22px; letter-spacing: 1px; margin: 0; color: var(--gold); flex: 1; }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; }
  .round.on { border-color: var(--gold); color: var(--gold); }
  a.round { display: inline-flex; align-items: center; justify-content: center; color: var(--mute); text-decoration: none; font-size: 12px; }

  .stances { display: flex; gap: 6px; }
  .stances button { flex: 1; padding: 7px 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-size: 13px; line-height: 1.2; }
  .stances button small { display: block; font-size: min(10px, 2.5vw); white-space: nowrap; color: var(--mute); }
  .stances button.on { border-color: var(--gold); background: var(--panel2); color: var(--gold); }

  .arena { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 8px; }
  .duel { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fighter { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .cap { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); }
  .stats { display: flex; gap: 5px; }
  .stat { font-weight: 800; font-size: 19px; padding: 2px 10px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--line); min-width: 58px; text-align: center; line-height: 1.1; }
  .stat small { display: block; font-size: 9px; font-weight: 600; color: var(--mute); letter-spacing: 1px; }
  .stat.mana { color: var(--mana); }
  .mid { width: 66px; text-align: center; }
  .mid .vs { font-family: Georgia, serif; color: var(--mute); font-size: 18px; }
  .mid .ok { font-size: 24px; font-weight: 800; margin-top: 4px; min-height: 30px; }
  .mid .ok.neg { color: var(--bad); } .mid .ok.pos { color: var(--good); }

  /* A card is two faces on .inner, which turns over (rotateY). --up lifts it toward you, --sag droops it, --t is 0.4 in fast play. */
  body { --t: 1; } body.turbo { --t: .4; }
  .card { --ry: 0deg; --up: 0; --sag: 0; position: relative; border-radius: 10px; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
  .card.down { --ry: 180deg; }
  .card::before { content: ''; position: absolute; inset: 8% 5% -5%; border-radius: 30%; background: radial-gradient(closest-side, rgba(0, 0, 0, .7), transparent); transform: translate3d(0, 3px, -1px) scale(calc(1 + var(--up) * .1)); opacity: calc(.6 + var(--up) * .4); transition: transform calc(.25s * var(--t)), opacity calc(.25s * var(--t)); }
  .inner { position: absolute; inset: 0; border-radius: inherit; transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transform: translate3d(0, calc(var(--up) * -3px + var(--sag) * 4px), calc(var(--up) * 10px)) rotateZ(calc(var(--sag) * -4deg)) rotateY(var(--ry)) scale(calc(1 - var(--sag) * .06));
    transition: transform calc(.4s * var(--t)) cubic-bezier(.3, .6, .3, 1) calc(var(--d, 0ms) * var(--t)); }
  .face { position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--line); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .front { background: linear-gradient(#32274f, #1d1630); display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; overflow: hidden; text-align: center; }
  .front::after { content: ''; position: absolute; inset: 0; background: rgba(24, 22, 30, .62); opacity: 0; transition: opacity calc(.4s * var(--t)); pointer-events: none; }
  .back { transform: rotateY(180deg); background: url(art/back.webp) center / cover, repeating-linear-gradient(45deg, #3d2e60 0 8px, #2c2148 8px 16px); }
  .back::after { content: ''; position: absolute; inset: -2px; border-radius: inherit; box-shadow: 0 0 14px rgba(232, 184, 74, .85); opacity: 0; }
  .card.bossc .front { background: linear-gradient(#4a2530, #23131a); border-color: #7d3a44; }
  /* A card with artwork: the picture fills the card and the text sits on a dark fade at the bottom. */
  .card.art .front { background-size: cover; background-position: center top; justify-content: flex-end; text-shadow: 0 1px 3px #000; }
  .card.art .ico { display: none; }
  .big.art .sub { color: var(--text); }
  .mini.art .front { padding-bottom: 3px; }
  .card.tap { cursor: pointer; }
  .card.tap .back { border-color: var(--gold); }
  .card.tap .back::after { animation: glow 1.1s infinite; }
  .card.tap:active { --up: 1; }
  @media (hover: hover) { .card.tap:hover { --up: 1; } }
  @keyframes glow { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .fighter { perspective: 700px; }
  .big { width: min(34vw, 150px); aspect-ratio: 5 / 7; transform-origin: 50% 100%; transition: transform calc(.4s * var(--t)) ease-out, opacity calc(.4s * var(--t)); }
  .big .front { padding: 6px; }
  .big .ico { font-size: min(15vw, 64px); line-height: 1; }
  .big .nm { font-family: Georgia, serif; font-size: 15px; font-weight: 700; }
  .big .sub { font-size: 11px; color: var(--mute); }
  .big .sub b { color: var(--mana); }
  /* Boss beaten: it falls back, away from you. Boss survives: it leans in and the champion is knocked back. */
  .big.dead { transform: rotateX(84deg); opacity: .3; transition: transform calc(.7s * var(--t)) cubic-bezier(.55, 0, .8, .4), opacity calc(.7s * var(--t)) ease-in; }
  .big.dead::before { transform: translate3d(0, 3px, -1px) scale(.5); opacity: 0; transition-duration: calc(.6s * var(--t)); }
  .big.lean { transform: translate3d(0, -2px, 12px) rotateX(-7deg); transition: transform calc(.5s * var(--t)) cubic-bezier(.3, 1.4, .5, 1); }
  .big.beaten { transform: translate3d(0, 4px, -40px) rotateX(24deg) rotateZ(-7deg); transition: transform calc(.5s * var(--t)) cubic-bezier(.2, 1.3, .5, 1); }
  .big.beaten .front::after { opacity: 1; }
  .big.hit { animation: hit calc(.42s * var(--t)) ease-out; }
  @keyframes hit { 25% { transform: translate3d(calc(var(--k) * 4px), 0, calc(var(--k) * -28px)) rotateX(calc(var(--k) * 15deg)) rotateZ(calc(var(--k) * 5deg)); } 60% { transform: rotateX(calc(var(--k) * -3deg)) rotateZ(calc(var(--k) * -1.5deg)); } }
  .bump { animation: bump .3s; }
  @keyframes bump { 40% { transform: scale(1.25); color: var(--gold); } }

  .meter { position: relative; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #6b3a1e, var(--gold)); opacity: .55; transition: width .4s ease-out; }
  .meter .segs { position: absolute; inset: 0; display: flex; }
  .meter .seg { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border-left: 1px solid var(--line); }
  .meter .seg:first-child { border-left: 0; color: var(--bad); }
  .meter .seg.kill { border-left: 3px solid var(--gold); }
  .meter .seg.lit { background: rgba(232, 184, 74, .35); color: #fff; }
  .mcap { display: flex; justify-content: space-between; font-size: 10px; color: var(--mute); margin-top: 3px; }

  .log { min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; padding: 4px 10px; border-radius: 10px; background: rgba(0, 0, 0, .25); }
  .log.win { background: rgba(111, 211, 138, .16); color: var(--good); font-weight: 700; font-size: 16px; }
  .log.bigwin { background: rgba(232, 184, 74, .2); color: var(--gold); font-weight: 800; font-size: 18px; animation: pulse .6s 3; }
  .log.lose { color: var(--mute); }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  /* The six lie on a table: the row tilts back. */
  .line { display: flex; gap: 6px; justify-content: center; transform: perspective(520px) rotateX(15deg); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
  .mini { flex: 1 1 0; min-width: 0; max-width: 68px; aspect-ratio: 5 / 7; border-radius: 8px; }
  .mini .front { padding: 2px; }
  .mini .ico { font-size: 20px; line-height: 1; }
  .mini .eff { font-size: 14px; font-weight: 800; white-space: nowrap; }
  .mini .cost { font-size: 10px; font-weight: 700; color: var(--mana); white-space: nowrap; min-height: 12px; }
  .mini.phys .front { border-color: var(--steel); }
  .mini.spell .front { border-color: var(--mana); background-image: linear-gradient(#22345a, #151b33); }
  .mini.mult .front { border-color: var(--gold); background-image: linear-gradient(#4a3a1c, #231a10); }
  .mini.now { --up: .7; }
  .mini.now .front { box-shadow: 0 0 12px rgba(255, 255, 255, .6); }
  .mini.void { --up: 0; --sag: 1; }
  .mini.void .front::after { opacity: 1; }
  .mini.void .eff { text-decoration: line-through; }

  /* Effects layer: short-lived shapes animated from JS (fly, burst, ring, ...), centred on left/top. */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .fx { position: absolute; width: var(--w); height: var(--h); margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2); border-radius: 50%; }
  .fx.streak { border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(190, 220, 255, .6) 45%, #fff); box-shadow: 0 0 10px #cfe4ff; }
  .fx.streak.gold { background: linear-gradient(90deg, transparent, rgba(232, 184, 74, .7) 45%, #fff6c8); box-shadow: 0 0 12px var(--gold); }
  .fx.slash { border-radius: 0; background: linear-gradient(90deg, transparent, #fff 40%, #d6ecff 60%, transparent); clip-path: polygon(0 50%, 48% 0, 100% 50%, 48% 100%); }
  .fx.dot { background: var(--c); box-shadow: 0 0 6px var(--c); }
  .fx.shard { border-radius: 0; background: linear-gradient(#fff, var(--c)); clip-path: polygon(50% 0, 100% 100%, 0 70%); }
  .fx.coin { background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 50%, #9a6a12); box-shadow: 0 0 6px var(--gold); }
  .fx.orb { background: radial-gradient(circle, #fff 0 22%, var(--c) 48%, transparent 72%); box-shadow: 0 0 18px var(--c); }
  .fx.bolt { border-radius: 0; margin-left: 0; transform-origin: 0 50%; background: linear-gradient(90deg, #9fd0ff, #fff); }
  .fx.bolt.glow { background: rgba(140, 200, 255, .45); }
  .fx.ring { border: 3px solid var(--c); box-shadow: 0 0 14px var(--c), inset 0 0 10px var(--c); }
  .fx.puff { background: radial-gradient(circle, rgba(170, 165, 180, .8), rgba(120, 115, 130, .3) 50%, transparent 70%); }
  .fx.flash { border-radius: 10px; background: radial-gradient(circle, #fff 15%, var(--c) 60%, transparent 95%); }
  .fx.screen { width: 100%; height: 100%; margin: 0; border-radius: 0; background: radial-gradient(circle, var(--c), transparent 80%); }
  .fx.rays { background: repeating-conic-gradient(rgba(255, 220, 130, .7) 0 7deg, transparent 7deg 20deg); -webkit-mask: radial-gradient(circle, #000 15%, transparent 68%); mask: radial-gradient(circle, #000 15%, transparent 68%); }
  .fx.num, .fx.stamp { width: auto; height: auto; margin: 0; border-radius: 0; white-space: nowrap; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px var(--c); }
  .fx.stamp { font-family: Georgia, serif; color: var(--gold); text-shadow: 0 4px 0 #5a3a0c, 0 0 30px rgba(232, 184, 74, .9), 0 0 4px #000; }

  /* Reduced motion: faces cross-fade in place, no recoil, fall or lean. */
  @media (prefers-reduced-motion: reduce) {
    .inner { transform: none; transition: none; }
    .face { -webkit-backface-visibility: visible; backface-visibility: visible; transition: opacity calc(.25s * var(--t)); }
    .back { transform: none; }
    .card:not(.down) .back, .card.down .front { opacity: 0; }
    .big.dead, .big.lean, .big.beaten { transform: none; opacity: 1; }
    .big.hit { animation: none; }
    .big.dead .front::after { opacity: 1; }
  }

  .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pill { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 10px; }
  .pill .k { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); }
  .pill .v { font-size: 17px; font-weight: 800; }
  .pill.win .v { color: var(--gold); }
  .betrow { grid-column: 1 / 3; display: flex; gap: 6px; align-items: stretch; }
  .sq { width: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-size: 22px; font-weight: 700; }
  .betrow .pill { width: 96px; text-align: center; }
  #play { flex: 1; min-height: 54px; border-radius: 27px; background: linear-gradient(#f3cb68, #c98f1e); color: #2a1a00; font-weight: 800; font-size: 19px; letter-spacing: 1px; box-shadow: 0 3px 0 #7d560c; }
  #play:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d560c; }

  #modal { position: fixed; inset: 0; background: rgba(8, 5, 14, .8); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #modal.open { display: flex; }
  .sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px 16px 24px; font-size: 14px; line-height: 1.45; user-select: text; -webkit-user-select: text; }
  .sheet h2 { font-family: Georgia, serif; color: var(--gold); margin: 0 0 6px; font-size: 20px; }
  .sheet h3 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); margin: 16px 0 6px; }
  .sheet p { margin: 6px 0; }
  .sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sheet td, .sheet th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .sheet th { font-size: 11px; color: var(--mute); font-weight: 600; }
  .sheet td.r, .sheet th.r { text-align: right; }
  .sheet .close { width: 100%; margin-top: 16px; padding: 12px; border-radius: 12px; background: var(--panel2); border: 1.5px solid var(--line); font-weight: 700; }
  .sheet .fine { font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bossfall</h1>
    <a class="round" href="3d.html" title="Switch to the 3D board" aria-label="Switch to the 3D board">3D</a>
    <button class="round" id="bSound" aria-label="Sound on or off" title="Sound">♪</button>
    <button class="round" id="bTurbo" aria-label="Fast play on or off" title="Fast play: flips every card for you">»</button>
    <button class="round" id="bInfo" aria-label="Rules and payouts" title="Rules">i</button>
  </header>

  <div class="stances" id="stances"></div>

  <div class="arena">
    <div class="duel">
      <div class="fighter">
        <div class="cap">Your champion</div>
        <div class="card big down" id="champ"></div>
        <div class="stats">
          <div class="stat"><span id="dmg">–</span><small>DMG</small></div>
          <div class="stat mana"><span id="mana">–</span><small>MANA</small></div>
        </div>
      </div>
      <div class="mid">
        <div class="vs">VS</div>
        <div class="ok" id="ok"></div>
      </div>
      <div class="fighter">
        <div class="cap">The boss</div>
        <div class="card big bossc down" id="boss"></div>
        <div class="stats"><div class="stat"><span id="hp">–</span><small>HP</small></div></div>
      </div>
    </div>

    <div>
      <div class="meter"><div class="fill" id="fill"></div><div class="segs" id="segs"></div></div>
      <div class="mcap"><span>boss survives</span><span>overkill pays more →</span></div>
    </div>

    <div class="log" id="log">Flip your champion, then flip six cards in any order. Out-damage the boss to win.</div>

    <div class="line" id="line"></div>
  </div>

  <div class="hud">
    <div class="pill"><div class="k">Coins</div><div class="v" id="bal"></div></div>
    <div class="pill win"><div class="k">Win</div><div class="v" id="win">0.00</div></div>
    <div class="betrow">
      <button class="sq" id="bMinus" aria-label="Lower play amount">−</button>
      <div class="pill"><div class="k">Play amount</div><div class="v" id="bet"></div></div>
      <button class="sq" id="bPlus" aria-label="Raise play amount">+</button>
      <button id="play">PLAY</button>
    </div>
  </div>
</div>

<div id="fx"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="engine.js"></script>
<script>
// The rules and maths (CHAMPS, CARDS, BOSSES, STANCES, playRound, ...) are in engine.js.
const $ = id => document.getElementById(id);
const BETS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100];
const START = 1000;
// phase: idle → champ (flip the champion) → cards (flip six) → idle
const S = { balance: START, betIdx: 3, stance: 'warband', phase: 'idle', turbo: false, sound: true };
let R = null, flips = 0, lock = false, bet = 0, queued = null;
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const wait = ms => new Promise(r => setTimeout(r, S.turbo ? ms * 0.4 : ms));
const payText = p => (p ? p + 'x' : '✕');

// Sound: small synth tones, no audio files.
let actx = null;
function tone(freq, dur = 0.12, type = 'triangle', when = 0, vol = 0.12) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) { /* no audio available */ }
}
const SFX = {
  flip: () => tone(520, 0.06, 'square', 0, 0.05),
  phys: () => { tone(220, 0.08, 'square', 0, 0.08); tone(440, 0.1, 'triangle', 0.05); },
  spell: () => { tone(660, 0.12, 'sine'); tone(990, 0.2, 'sine', 0.08); },
  mult: () => [440, 660, 880, 1320].forEach((f, i) => tone(f, 0.14, 'sawtooth', i * 0.07, 0.08)),
  void: () => { tone(200, 0.2, 'square', 0, 0.06); tone(150, 0.25, 'square', 0.12, 0.06); },
  boss: () => tone(140, 0.3, 'sawtooth', 0, 0.1),
  back: () => tone(300, 0.08, 'sine', 0, 0.05),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', i * 0.1)),
  big: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', i * 0.09, 0.15)),
  lose: () => { tone(294, 0.2, 'sine'); tone(220, 0.35, 'sine', 0.15); },
  boom: () => { tone(70, 0.5, 'sawtooth', 0, 0.14); tone(52, 0.6, 'square', 0.05, 0.08); },
  fury: () => { tone(98, 0.5, 'sawtooth', 0, 0.12); [523, 784, 1047, 1568, 2093].forEach((f, i) => tone(f, 0.3, 'square', 0.06 + i * 0.06, 0.06)); },
};

// Artwork is art/<name>.webp. A picture is used once it has loaded; until then, or if it is missing, the emoji shows.
const ART = {};
[...CHAMPS, ...BOSSES, ...CARDS].forEach(c => { const i = new Image(); i.onload = () => { ART[c.name] = i.src; }; i.src = `art/${slug(c.name)}.webp`; });
function setArt(el, c, fade) {
  const url = ART[c.name];
  el.classList.toggle('art', !!url);
  front(el).style.backgroundImage = url ? `linear-gradient(transparent ${fade}%, rgba(12, 8, 20, .95) 92%), url("${url}")` : '';
}

// Every card is two faces; the front is filled while the card is still face-down, then it turns over.
const FACES = '<div class="inner"><div class="face front"></div><div class="face back"></div></div>';
const FLIP = 400;
const front = el => el.querySelector('.front');
function bigCard(el, c, sub) {
  setArt(el, c, 55);
  front(el).innerHTML = `<div class="ico">${c.icon}</div><div><div class="nm">${c.name}</div><div class="sub">${sub}</div></div>`;
}
function reveal(el) { el.style.removeProperty('--d'); el.classList.remove('down', 'tap'); }
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function setNum(el, v) { if (el.textContent !== String(v)) { el.textContent = v; bump(el); } }
function log(text, cls = '') { const l = $('log'); l.className = 'log ' + cls; l.textContent = text; }

// Effects: elements in #fx animated with el.animate(), removed when done. Durations follow wait()'s turbo scale.
const GOLD = '#e8b84a', RED = 'rgba(255, 70, 60, .8)';
const SPELL = { Spark: '#ffe45c', Firebolt: '#ff8a2a', Lightning: '#bfe3ff', Meteor: '#ff6a2a', Cataclysm: '#ff3d1a' };
const T = ms => (S.turbo ? ms * 0.4 : ms);
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const live = new Set();
const at = (el, fx = 0.5, fy = 0.5) => { const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; };
const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const rnd = (a, b) => a + Math.random() * (b - a);
function fx(cls, [x, y], w, h = w, css = '') {
  const e = document.createElement('div');
  e.className = 'fx ' + cls; e.style.cssText = `left:${x}px;top:${y}px;--w:${w}px;--h:${h}px;${css}`;
  $('fx').appendChild(e); return e;
}
// Animate; an effect element is removed when done, a board element (shake, punch) keeps no fill.
function anim(e, kf, ms, o = {}) {
  const own = e.parentNode === $('fx');
  const a = e.animate(kf, { duration: T(ms), easing: 'ease-out', fill: own ? 'both' : 'none', ...o, delay: T(o.delay || 0) });
  const p = a.finished.catch(() => {}).then(() => { if (own) e.remove(); live.delete(p); });
  live.add(p); return p;
}
// Fly e from p0 to p1 on a curve bowed sideways by arc px, pointing along it.
function fly(e, p0, p1, arc, ms, o = {}) {
  const [x0, y0] = p0, [x1, y1] = p1, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1;
  const cx = x0 + dx / 2 - dy / l * arc, cy = y0 + dy / 2 + dx / l * arc;
  return anim(e, [0, 0.25, 0.5, 0.75, 1].map(t => {
    const u = 1 - t, x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
    const a = Math.atan2(2 * u * (cy - y0) + 2 * t * (y1 - cy), 2 * u * (cx - x0) + 2 * t * (x1 - cx));
    return { transform: `translate(${x - x0}px, ${y - y0}px) rotate(${a}rad)`, opacity: o.op ?? 1 };
  }), ms, { easing: o.ease || 'cubic-bezier(.45, 0, .85, .55)', delay: o.delay });
}
function burst(p, { n = 8, c = '#fff', d = 50, s = 5, ms = 480, cls = 'dot' } = {}) {
  if (still()) return;
  for (let i = 0; i < n; i++) {
    const a = (i + rnd(0, 0.6)) / n * 2 * Math.PI, r = d * rnd(0.55, 1.15);
    anim(fx(cls, p, s, cls === 'shard' ? s * 1.6 : s, `--c:${c}`), [{ transform: `rotate(${a}rad)`, opacity: 1 },
      { transform: `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r}px) rotate(${a * 3}rad) scale(.3)`, opacity: 0 }], ms * rnd(0.8, 1.2), { easing: 'cubic-bezier(.2, .7, .4, 1)' });
  }
}
function ring(p, size, c, ms = 500, delay = 0) {
  if (still()) return;
  anim(fx('ring', p, size, size, `--c:${c}`), [{ transform: 'scale(.2)', opacity: 1 }, { transform: 'scale(1)', opacity: 0 }], ms, { delay });
}
function flashOn(el, c, peak = 0.85, ms = 280) {
  const r = el.getBoundingClientRect();
  return anim(fx('flash', at(el), r.width + 16, r.height + 16, `--c:${c}`), [{ opacity: 0 }, { opacity: peak, offset: 0.2 }, { opacity: 0 }], ms);
}
function screen(c, peak = 0.35, ms = 380) { if (!still()) anim(fx('screen', [0, 0], 0, 0, `--c:${c}`), [{ opacity: 0 }, { opacity: peak, offset: 0.15 }, { opacity: 0 }], ms); }
function shake(px, ms) {
  if (still()) return;
  anim(document.querySelector('.arena'), [0, 1, -0.8, 0.6, -0.4, 0.2, 0].map((f, i) => ({ transform: `translate(${f * px}px, ${(i % 2 ? -0.5 : 0.5) * f * px}px)` })), ms, { easing: 'linear' });
}
function punch(el, k) { if (!still()) anim(el, [{ transform: 'scale(1)' }, { transform: `scale(${k})`, offset: 0.3 }, { transform: 'scale(1)' }], 420); }
// A number that rises and fades (fade only with reduced motion); a stamp that slams in and holds.
function num(p, text, c, size = 26, ms = 800) {
  const e = fx('num', p, 0, 0, `--c:${c};font-size:${size}px${c === GOLD ? ';color:#ffe08a' : ''}`); e.textContent = text;
  return anim(e, still() ? [{ opacity: 0, transform: 'translate(-50%, -50%)' }, { opacity: 1, offset: 0.2 }, { opacity: 0 }]
    : [{ transform: 'translate(-50%, -50%) scale(.5)', opacity: 0 }, { transform: 'translate(-50%, -85%) scale(1.2)', opacity: 1, offset: 0.2 }, { transform: 'translate(-50%, -260%) scale(1)', opacity: 0 }], ms);
}
function stamp(text, size, ms) {
  size = Math.min(size, innerWidth * 1.4 / text.length);
  const e = fx('stamp', at(document.querySelector('.arena'), 0.5, 0.42), 0, 0, `font-size:${size}px`); e.textContent = text;
  const m = s => `translate(-50%, -50%) scale(${still() ? 1 : s})`;
  return anim(e, [{ transform: m(3), opacity: 0 }, { transform: m(0.9), opacity: 1, offset: 0.18 }, { transform: m(1), offset: 0.26 }, { transform: m(1.04), opacity: 1, offset: 0.75 }, { transform: m(1.15), opacity: 0 }], ms, { easing: 'ease-in-out' });
}
function rays(p, size, ms) { if (!still()) anim(fx('rays', p, size), [{ transform: 'scale(.3) rotate(0)', opacity: 0 }, { transform: 'scale(1) rotate(25deg)', opacity: 1, offset: 0.3 }, { transform: 'scale(1.1) rotate(60deg)', opacity: 0 }], ms); }
function countNum(el, from, to, ms) {
  const t0 = performance.now(), d = T(ms);
  (function f(t) { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(f); else bump(el); })(t0);
}
function clearFx() { $('fx').getAnimations({ subtree: true }).forEach(a => a.cancel()); $('fx').replaceChildren(); live.clear(); }

// The attack leaves the card and travels; resolves at the moment of impact.
async function launch(el, c, voided) {
  if (still()) return;
  const p0 = at(el, 0.5, 0.35), p1 = at($('boss')), col = SPELL[c.name];
  if (c.t === 'phys') return fly(fx('streak', p0, 40 + c.v * 3, 3 + c.v * 0.45), p0, p1, -36, 260);
  if (c.t === 'mult') return fly(fx('streak gold', p0, 46, 6), p0, at($('dmg')), 40, 280);
  const s = 22 + c.v * 0.7;
  if (voided) {
    const p = lerp(p0, p1, 0.33);
    await fly(fx('orb', p0, s, s, `--c:${col}`), p0, p, 12, 240, { ease: 'ease-out', op: 0.8 });
    anim(fx('puff', p, s * 3), [{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(1)', opacity: 0 }], 500);
    burst(p, { n: 5, c: '#8a8496', d: 22, s: 4, ms: 420 });
    return wait(90);
  }
  if (c.name === 'Lightning') {
    const l = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), a = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]), N = 9;
    const ys = [...Array(N + 1)].map((_, i) => (i % N ? rnd(20, 80) : 50));
    for (const [cls, th] of [['bolt glow', 14], ['bolt', 4]]) {
      const pts = ys.map((y, i) => `${i / N * 100}% ${y - th}%`).concat(ys.map((y, i) => `${i / N * 100}% ${y + th}%`).reverse());
      anim(fx(cls, p0, l, 36, `clip-path:polygon(${pts})`), [{ transform: `rotate(${a}rad) scaleX(0)`, opacity: 1 }, { transform: `rotate(${a}rad) scaleX(1)`, opacity: 1, offset: 0.3 },
        { opacity: 0.3, offset: 0.5 }, { opacity: 1, offset: 0.65 }, { transform: `rotate(${a}rad) scaleX(1)`, opacity: 0 }], 360, { easing: 'linear' });
    }
    return wait(110);
  }
  const from = c.name === 'Meteor' ? [p1[0] + 80, -30] : p0, arc = c.name === 'Meteor' ? 0 : 34, ms = c.name === 'Meteor' ? 320 : 290;
  for (let i = 3; i > 0; i--) fly(fx('orb', from, s * (1 - i * 0.2), s * (1 - i * 0.2), `--c:${col}`), from, p1, arc, ms, { delay: i * 24, op: 0.5 });
  return fly(fx('orb', from, s, s, `--c:${col}`), from, p1, arc, ms);
}
function impact(c, kill) {
  const b = $('boss'), p = at(b), col = c.t === 'phys' ? '#eef6ff' : SPELL[c.name];
  b.style.setProperty('--k', (c.t === 'phys' ? 0.4 + c.v / 30 : 0.8 + c.v / 50) + (kill ? 0.3 : 0));
  b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
  flashOn(b, c.t === 'phys' ? RED : col, 0.75);
  num(at(b, 0.5, 0.3), '+' + c.v, c.t === 'phys' ? '#f66' : col, 24 + c.v / 2);
  if (c.t === 'phys') {
    if (!still()) anim(fx('slash', p, b.offsetWidth * 1.3, 5 + c.v * 0.6), [{ transform: 'rotate(-38deg) scaleX(0)', opacity: 1 }, { transform: 'rotate(-38deg) scaleX(1)', opacity: 1, offset: 0.35 }, { transform: 'rotate(-38deg) scaleX(1.05)', opacity: 0 }], 340);
    burst(p, { n: 3 + Math.round(c.v / 2), c: '#eef6ff', d: 40 + c.v * 3, s: 4 });
  } else {
    ring(p, 50 + c.v * 2.5, col, 450);
    burst(p, { n: 6 + Math.round(c.v / 6), c: col, d: 45 + c.v * 2, s: 5 + c.v / 10 });
    if (c.name === 'Cataclysm') { screen(col, 0.4); shake(7, 420); SFX.boom(); }
    else if (c.name === 'Meteor') shake(4, 300);
  }
  if (kill) killFx();
}
// The hit that first takes the boss to zero: white flash, shatter.
function killFx() {
  const b = $('boss'), p = at(b);
  flashOn(b, '#fff', 1, 420);
  burst(p, { n: 10, c: '#fff', d: 110, s: 9, ms: 620, cls: 'shard' });
  ring(p, 170, '#fff', 520, 60);
  shake(5, 320); SFX.boom();
}
// Multipliers: flare grows with the multiplier, and one step more when it adds 50+ damage.
function multFx(c, from, to) {
  const lvl = Math.min(4, { 1.5: 1, 2: 2, 3: 3 }[c.v] + (to - from >= 50 ? 1 : 0)), ch = $('champ'), pc = at(ch), d = $('dmg'), w = ch.offsetWidth;
  num(at(ch, 0.5, 0.3), '×' + c.v, GOLD, 26 + lvl * 6, 700 + lvl * 100);
  ring(pc, w * 1.3, GOLD, 520);
  punch(d.parentElement, 1.2 + lvl * 0.15);
  if (lvl >= 2) { ring(pc, w * 1.8, GOLD, 600, 120); flashOn(ch, GOLD, 0.7); shake(3, 280); }
  if (lvl >= 3) {
    // ×3 itself is always one notch bigger than a ×2 that earned the same level.
    const big = lvl - 3 + (c.v === 3 ? 1 : 0);
    stamp('×' + c.v, 96 + big * 18, 1000); rays(pc, w * (2.2 + big * 0.5), 1000); screen(GOLD, 0.25 + big * 0.1);
    shake(4 + big * 2, 520); burst(pc, { n: 8 + big * 3, c: GOLD, d: 110 + big * 30, s: 6, ms: 700 }); SFX.fury();
    if (big) ring(pc, w * 2.4, '#fff3b0', 650, 200);

}
// The win, by tier: a coin burst at 3-4; from 5 a growing celebration with the pay stamped in the middle.
function celebrate(tier, pay) {
  const wp = at($('win'));
  if (tier >= 3) {
    burst(wp, { n: 8, c: GOLD, d: 60 });
    if (!still()) for (let i = 0; i < 6; i++) { const x = rnd(-60, 60), e = fx('coin', wp, 12);
      anim(e, [{ transform: 'translate(0, 0)' }, { transform: `translate(${x * 0.6}px, ${rnd(-110, -70)}px)`, offset: 0.45 }, { transform: `translate(${x}px, 10px)`, opacity: 0 }], 700, { easing: 'ease-in-out', delay: i * 30 }); }
  }
  if (tier < 5) return;
  const lvl = tier - 4;
  screen(GOLD, 0.25 + lvl * 0.1, 500); stamp(pay + 'x', 64 + lvl * 16, 1100 + lvl * 150);
  anim($('win').parentElement, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], 380, { iterations: 2 + lvl });
  if (!still()) for (let i = 0; i < 10 + lvl * 4; i++) { const x = rnd(0, innerWidth), e = fx(i % 3 ? 'dot' : 'coin', [x, -12], rnd(5, 10), undefined, `--c:${GOLD}`);
    anim(e, [{ transform: 'translateY(0)' }, { transform: `translate(${rnd(-30, 30)}px, ${innerHeight + 30}px) rotate(${rnd(-3, 3)}turn)` }], rnd(800, 1000), { easing: 'ease-in', delay: rnd(0, 600) }); }
  if (lvl === 3) { const p = at(document.querySelector('.arena'), 0.5, 0.42); rays(p, 420, 1400); screen('#fff', 0.3, 300); shake(8, 500); burst(p, { n: 14, c: GOLD, d: 160, s: 7, ms: 800 }); SFX.fury(); }
}

// Meter: eight equal segments, one per payout tier.
const BREAKS = [-60, 0, 10, 25, 50, 100, 200, 400, 800];
function meterPos(o) {
  const n = BREAKS.length - 1;
  o = Math.max(BREAKS[0], Math.min(BREAKS[n], o));
  for (let i = 0; i < n; i++) if (o <= BREAKS[i + 1]) return (i + (o - BREAKS[i]) / (BREAKS[i + 1] - BREAKS[i])) / n;
  return 1;
}
function renderMeter(lit = -1) {
  $('segs').innerHTML = STANCES[S.stance].pay.map((p, i) => `<div class="seg ${i === 1 ? 'kill' : ''} ${i === lit ? 'lit' : ''}">${payText(p)}</div>`).join('');
}
function setOverkill(o) {
  const ok = $('ok');
  if (o === null) { ok.textContent = ''; $('fill').style.width = '0'; return; }
  ok.textContent = (o > 0 ? '+' : '') + o;
  ok.className = 'ok ' + (o >= 0 ? 'pos' : 'neg');
  $('fill').style.width = (meterPos(o) * 100).toFixed(1) + '%';
}

function renderLine() { $('line').innerHTML = `<div class="card mini down">${FACES}</div>`.repeat(6); }
function renderStances() {
  const busy = S.phase !== 'idle';
  $('stances').innerHTML = Object.entries(STANCES).map(([k, st]) =>
    `<button data-k="${k}" class="${k === S.stance ? 'on' : ''}" ${busy ? 'disabled' : ''}>${st.name}<small>${st.tag} · max ${st.pay[st.pay.length - 1]}x</small></button>`).join('');
}
function renderHud() {
  const busy = S.phase !== 'idle';
  $('bal').textContent = fmt(S.balance);
  $('bet').textContent = fmt(BETS[S.betIdx]);
  $('bMinus').disabled = busy || S.betIdx === 0;
  $('bPlus').disabled = busy || S.betIdx === BETS.length - 1;
  $('play').textContent = busy ? 'FLIP' : S.balance < BETS[0] ? 'REFILL' : 'PLAY';
  $('bSound').classList.toggle('on', S.sound);
  $('bTurbo').classList.toggle('on', S.turbo);
  document.body.classList.toggle('turbo', S.turbo);
}
function countUp(el, to) {
  const t0 = performance.now(), d = S.turbo ? 300 : 900;
  (function f(t) { const k = Math.min(1, (t - t0) / d); el.textContent = fmt(to * k); if (k < 1) requestAnimationFrame(f); })(t0);
}
// Everything turns face-down again (the row of six one after another); old fronts are overwritten before the next reveal.
function resetBoard() {
  for (const id of ['champ', 'boss']) { $(id).classList.remove('dead', 'lean', 'beaten', 'hit', 'tap'); $(id).classList.add('down'); }
  $('line').querySelectorAll('.mini').forEach((x, i) => { x.classList.remove('now', 'void', 'tap'); x.style.setProperty('--d', i * 45 + 'ms'); x.classList.add('down'); });
  $('dmg').textContent = '–'; $('mana').textContent = '–'; $('hp').textContent = '–';
  setOverkill(null); renderMeter(); clearFx();
}
// Fast play flips everything for the player.
function auto() { if (S.turbo && S.phase !== 'idle') setTimeout(next, 120); }

async function start() {
  if (S.balance < BETS[0]) { S.balance = START; renderHud(); log('Your coins are refilled. Good luck!'); return; }
  while (S.betIdx > 0 && BETS[S.betIdx] > S.balance) S.betIdx--;
  bet = BETS[S.betIdx];
  S.balance -= bet; S.phase = 'champ'; lock = true; flips = 0; queued = null;
  renderHud(); renderStances(); $('win').textContent = fmt(0);
  const shown = !$('boss').classList.contains('down');
  resetBoard();
  if (shown) await wait(FLIP);
  R = playRound();
  bigCard($('boss'), R.boss, 'Boss'); reveal($('boss')); SFX.boss();
  setNum($('hp'), R.boss.hp);
  log(`${R.boss.name} appears with ${R.boss.hp} HP. Tap your champion to flip it.`);
  await wait(500);
  $('champ').classList.add('tap');
  lock = false; auto();
}

async function flipChamp() {
  if (S.phase !== 'champ' || lock) return;
  lock = true;
  const c = R.champ;
  bigCard($('champ'), c, `${c.atk} ATK · <b>${c.mana} mana</b>`); reveal($('champ')); SFX.phys();
  setNum($('dmg'), c.atk); setNum($('mana'), c.mana); setOverkill(c.atk - R.boss.hp);
  log(`${c.name}: ${c.atk} attack, ${c.mana} mana. Now flip the six cards in any order.`);
  await wait(600);
  S.phase = 'cards';
  $('line').querySelectorAll('.mini').forEach(x => { x.style.removeProperty('--d'); x.classList.add('tap'); });
  lock = false; auto();
}

async function flipCard(el) {
  if (S.phase !== 'cards' || !el || !el.classList.contains('down')) return;
  // A tap during the previous card's animation is kept and played next.
  if (lock) { queued = el; return; }
  lock = true;
  // The deck is shuffled, so the n-th card flipped is the n-th card dealt, whichever one is tapped.
  const ev = R.events[flips++], c = ev.card;
  $('line').querySelectorAll('.mini').forEach(x => x.classList.remove('now'));
  el.className = 'card mini down tap';
  front(el).innerHTML = `<div class="ico">${c.icon}</div><div class="eff">${effText(c)}</div><div class="cost">${c.t === 'spell' ? c.cost + ' mana' : ''}</div>`;
  setArt(el, c, 40);
  el.classList.add(c.t, 'now');
  reveal(el); SFX.flip();
  await wait(220);
  log(ev.text);
  // The attack flies to the boss (a multiplier to the DMG number); numbers, recoil and sound land on impact.
  const prev = flips > 1 ? R.events[flips - 2].dmg : R.champ.atk, kill = prev < R.boss.hp && ev.dmg >= R.boss.hp;
  await launch(el, c, ev.voided);
  SFX[ev.fx]();
  setNum($('mana'), ev.mana); setOverkill(ev.dmg - R.boss.hp);
  let hold = 400;
  if (ev.voided) el.classList.add('void');
  else if (c.t === 'mult') { hold = multFx(c, prev, ev.dmg) >= 3 ? 1050 : 650; if (kill) killFx(); }
  else { setNum($('dmg'), ev.dmg); impact(c, kill); }
  await wait(kill ? hold + 150 : hold);
  if (flips === 6) return finish();
  lock = false;
  if (queued) { const q = queued; queued = null; return flipCard(q); }
  auto();
}

async function finish() {
  $('line').querySelectorAll('.mini').forEach(x => x.classList.remove('now'));
  const pay = STANCES[S.stance].pay[R.tier], win = Math.round(pay * bet * 100) / 100;
  renderMeter(R.tier);
  $('boss').classList.remove('hit');
  if (win > 0) {
    $('boss').classList.add('dead');
    const big = pay >= 5, even = win <= bet;
    log(`${R.boss.name} falls! Overkill +${R.overkill} · ${pay}x · you ${even ? 'get back' : 'win'} ${fmt(win)}`, big ? 'bigwin' : even ? '' : 'win');
    (big ? SFX.big : even ? SFX.back : SFX.win)();
    S.balance += win; countUp($('win'), win); celebrate(R.tier, pay);
  } else {
    $('boss').classList.add('lean'); $('champ').classList.add('beaten');
    log(`${R.boss.name} survives with ${-R.overkill} HP left.`, 'lose');
    SFX.lose();
  }
  // The round ends once its last effects are gone, so #fx is empty when PLAY comes back.
  await Promise.all([wait(win > 0 ? 700 : 300), Promise.race([Promise.all(live), wait(2600)])]);
  clearFx(); S.phase = 'idle'; lock = false; renderHud(); renderStances();
}

// The main button and the spacebar: start a round, or flip the next card.
function next() {
  if (lock) return;
  if (S.phase === 'idle') start();
  else if (S.phase === 'champ') flipChamp();
  else flipCard($('line').querySelector('.mini.down'));
}

function openInfo() {
  const champs = CHAMPS.map(c => `<tr><td>${c.icon} ${c.name}</td><td class="r">${c.atk}</td><td class="r">${c.mana}</td><td class="r">${c.w === 1 ? 'rare' : ''}</td></tr>`).join('');
  const kind = { phys: 'Attack', spell: 'Spell', mult: 'Multiplier' };
  const rows = CARDS.map(c => `<tr><td>${c.icon} ${c.name}</td><td>${kind[c.t]}</td><td class="r">${effText(c)}</td><td class="r">${c.cost || '–'}</td><td class="r">${c.n}</td></tr>`).join('');
  const bossRows = BOSSES.map(b => `${b.icon} ${b.name} (${b.hp} HP)`).join(', ');
  const st = Object.values(STANCES);
  const pays = TIER_LABEL.map((l, i) => `<tr><td>${l}</td>${st.map(s => `<td class="r">${payText(s.pay[i])}</td>`).join('')}</tr>`).join('');
  $('sheet').innerHTML = `
    <h2>How Bossfall works</h2>
    <p>Each round you get one random <b>champion</b>, one random boss, and <b>six face-down cards</b> from a ${CARDS.reduce((a, c) => a + c.n, 0)}-card deck.</p>
    <p>Flip your champion first. Its attack is your starting damage and its mana pays for spells. Then flip the six cards in any order you like. Each card takes effect the moment it is flipped.</p>
    <p>When all six are flipped, your damage must be at least the boss's HP. If the boss survives, you win nothing. If it falls, the amount you beat it by is your <b>overkill</b>, and more overkill pays more.</p>
    <h3>Card types</h3>
    <p><b>Attacks</b> add damage and cost nothing.<br><b>Spells</b> add more damage but cost mana. If you don't have enough mana left when a spell is flipped, it fizzles and does nothing.<br><b>Multipliers</b> multiply all the damage you have so far, so one that turns up late is worth more.</p>
    <p class="fine">The cards are shuffled and face down, so every card you tap is equally likely to be any of the cards left.</p>
    <h3>Payouts (× play amount)</h3>
    <table><tr><th>Result</th>${st.map(s => `<th class="r">${s.name}</th>`).join('')}</tr>${pays}
    <tr><td>Return to player</td>${st.map(s => `<td class="r">${s.rtp}%</td>`).join('')}</tr></table>
    <p class="fine">The stance only changes the payouts, not the cards. Pick it before you play.</p>
    <h3>Champions</h3>
    <table><tr><th>Champion</th><th class="r">Attack</th><th class="r">Mana</th><th></th></tr>${champs}</table>
    <h3>Bosses</h3>
    <p>${bossRows}. Each is equally likely.</p>
    <h3>Cards</h3>
    <table><tr><th>Card</th><th>Type</th><th class="r">Effect</th><th class="r">Mana</th><th class="r">In deck</th></tr>${rows}</table>
    <h3>Buttons</h3>
    <p><b>−</b> / <b>+</b> change the play amount. <b>PLAY</b> (or the spacebar) starts a round, then becomes <b>FLIP</b>, which flips the next card for you. <b>»</b> is fast play: it flips every card automatically. <b>♪</b> turns sound on or off. <b>i</b> opens this page.</p>
    <p class="fine">This is a play-coin prototype. No real money is involved and coins have no value. Results are generated in your browser. Return to player is measured over many simulated rounds.</p>
    <button class="close" id="bClose">Close</button>`;
  $('modal').classList.add('open');
  $('bClose').onclick = () => $('modal').classList.remove('open');
}

$('play').onclick = next;
$('champ').onclick = flipChamp;
$('line').onclick = e => flipCard(e.target.closest('.mini'));
$('bMinus').onclick = () => { if (S.phase === 'idle' && S.betIdx > 0) { S.betIdx--; renderHud(); } };
$('bPlus').onclick = () => { if (S.phase === 'idle' && S.betIdx < BETS.length - 1) { S.betIdx++; renderHud(); } };
$('bSound').onclick = () => { S.sound = !S.sound; renderHud(); if (S.sound) SFX.flip(); };
$('bTurbo').onclick = () => { S.turbo = !S.turbo; renderHud(); auto(); };
$('bInfo').onclick = openInfo;
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('open'); };
$('stances').onclick = e => {
  const b = e.target.closest('button');
  if (!b || S.phase !== 'idle') return;
  S.stance = b.dataset.k; renderStances(); renderMeter();
};
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || $('modal').classList.contains('open')) return;
  e.preventDefault();
  // Otherwise the spacebar would also click whichever button was tapped last.
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  next();
});

// iOS Safari only applies :active (the press lift) when the page listens for touches.
document.addEventListener('touchstart', () => {}, { passive: true });
$('champ').innerHTML = $('boss').innerHTML = FACES;
renderStances(); renderMeter(); renderLine(); renderHud();
</script>
</body>
</html>
